<div class="card">
  <h2>Datos del Paciente</h2>

  <p><strong>Nombre:</strong> {{ paciente.nombre }}</p>
  <p><strong>Apellido:</strong> {{ paciente.apellido }}</p>
  <p><strong>Edad:</strong> {{ paciente.edad }}</p>
  <p><strong>Correo Electrónico:</strong> {{ paciente.correo }}</p>
  <p><strong>Número de Historia Clínica:</strong> {{ paciente.historiaClinica }}</p>
  <p><strong>Tipo de Afiliación:</strong> {{ paciente.afiliacion }}</p>

  <div class="button-group">
    <button (click)="agregar()">Agregar</button>
    <button (click)="modificar()">Modificar</button>
    <button (click)="eliminar()">Eliminar</button>
    <button (click)="consultar()">Consultar</button>
  </div>
</div>
