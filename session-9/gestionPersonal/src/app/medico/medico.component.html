<div class="card">
  <h2>Datos del Médico</h2>

  <p><strong>Nombre:</strong> {{ medico.nombre }}</p>
  <p><strong>Apellido:</strong> {{ medico.apellido }}</p>
  <p><strong>Edad:</strong> {{ medico.edad }}</p>
  <p><strong>Correo Electrónico:</strong> {{ medico.correo }}</p>
  <p><strong>Especialidad:</strong> {{ medico.especialidad }}</p>
  <p><strong>Número de Licencia Médica:</strong> {{ medico.licenciaMedica }}</p>

  <div class="button-group">
    <button (click)="agregar()">Agregar</button>
    <button (click)="modificar()">Modificar</button>
    <button (click)="eliminar()">Eliminar</button>
    <button (click)="consultar()">Consultar</button>
  </div>
</div>
