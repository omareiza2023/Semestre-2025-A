<ion-content class="container">
  <div class="profile-header">
    <img src="assets/perfil-cliente.png" alt="Perfil" class="profile-img">
    <h3>!Bienvenido!</h3>
  </div>

  <div class="grid-buttons">
    <button class="card-button" (click)="navigateToWhatsApp()">
      <div class="card-content">
        <ion-icon name="chatbox-ellipses-outline" class="icon"></ion-icon>
        <span>Contactarnos</span>
      </div>
    </button>

    <button class="card-button" routerLink="/mis-reservas">
      <div class="card-content">
        <ion-icon name="calendar-outline" class="icon"></ion-icon>
        <span>Mis Reservas</span>
      </div>
    </button>

    <button class="card-button" routerLink="/agendar-cita">
      <div class="card-content">
        <ion-icon name="calendar-outline" class="icon"></ion-icon>
        <span>Agendar</span>
      </div>
    </button>

    <button class="card-button" routerLink="/info-user">
      <div class="card-content">
        <ion-icon name="person-outline" class="icon"></ion-icon>
        <span>Editar información</span>
      </div>
    </button>

    <button class="card-button" (click)="navigateToGoogleMaps()">
      <div class="card-content">
        <ion-icon name="location-outline" class="icon"></ion-icon>
        <span>Ubicación de la barbería</span>
      </div>
    </button>

    <button class="card-button" (click)="confirmDeleteAccount()">
      <div class="card-content">
        <ion-icon name="trash-outline" class="icon"></ion-icon>
        <span>Eliminar cuenta</span>
      </div>
    </button>
  </div>

  <button class="logout-button" (click)="confirmLogout()">Cerrar sesión</button>
</ion-content>
